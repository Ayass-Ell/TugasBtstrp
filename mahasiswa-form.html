                <!-- Begin Page Content -->
                <div class="container-fluid">

                    <div class="d-sm-flex align-items-center justify-content-between mb-4">
                        <h1 class="h3 mb-0 text-gray-800" id="formTitle" data-new="Tambah Mahasiswa Baru" data-edit="Edit Data Mahasiswa">Tambah Mahasiswa Baru</h1>
                        <a href="mahasiswa.html" class="d-none d-sm-inline-block btn btn-sm btn-secondary shadow-sm">
                            <i class="fas fa-arrow-left fa-sm text-white-50"></i> Kembali ke Daftar Mahasiswa</a>
                    </div>

                    <div class="row">
                        <div class="col-xl-7 col-lg-9">
                            <div class="card shadow mb-4">
                                <div class="card-header py-3">
                                    <h6 class="m-0 font-weight-bold text-primary">Tambah Mahasiswa</h6>
                                </div>
                                <div class="card-body">
<form id="formMahasiswa" autocomplete="off">
                        <input type="hidden" id="mhsOldNim">
                        <div class="form-group">
                            <label for="mhsNim" class="font-weight-bold">NIM (Nomor Induk Mahasiswa)</label>
                            <input type="text" class="form-control" id="mhsNim" placeholder="Contoh: 230101004" pattern="[0-9]{6,12}" title="NIM berupa angka 6-12 digit" required>
                        </div>
                        <div class="form-group">
                            <label for="mhsNama" class="font-weight-bold">Nama Lengkap Mahasiswa</label>
                            <input type="text" class="form-control" id="mhsNama" placeholder="Nama lengkap sesuai KTM" required>
                        </div>
                        <div class="form-group">
                            <label for="mhsProdi" class="font-weight-bold">Program Studi</label>
                            <select class="form-control" id="mhsProdi" required></select>
                        </div>
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="mhsAngkatan" class="font-weight-bold">Angkatan</label>
                                <select class="form-control" id="mhsAngkatan" required>
                                    <option value="2026">2026</option>
                                    <option value="2025">2025</option>
                                    <option value="2024">2024</option>
                                    <option value="2023" selected>2023</option>
                                    <option value="2022">2022</option>
                                </select>
                            </div>
                            <div class="form-group col-md-6">
                                <label for="mhsGender" class="font-weight-bold">Jenis Kelamin</label>
                                <select class="form-control" id="mhsGender" required>
                                    <option value="Laki-laki">Laki-laki</option>
                                    <option value="Perempuan">Perempuan</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="mhsEmail" class="font-weight-bold">Email Student</label>
                            <input type="email" class="form-control" id="mhsEmail" placeholder="nama@student.ac.id" required>
                        </div>
                        <div class="form-group mb-0">
                            <label for="mhsStatus" class="font-weight-bold">Status</label>
                            <select class="form-control" id="mhsStatus" required>
                                <option value="Aktif">Aktif</option>
                                <option value="Cuti">Cuti</option>
                                <option value="Non-Aktif">Non-Aktif</option>
                            </select>
                        </div>
                    </form>
                                </div>
                                <div class="card-footer text-right bg-white">
                                    <a class="btn btn-secondary" href="mahasiswa.html">Batal</a>
                                    <button class="btn btn-primary" type="submit" form="formMahasiswa">Simpan Data</button>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content">

                <!-- Topbar -->
                <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">

                    <!-- Sidebar Toggle (Topbar) -->
                    <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3">

                    </button>

                    <!-- Topbar Navbar -->
                    <ul class="navbar-nav ml-auto">

                        <div class="topbar-divider d-none d-sm-block"></div>

                        <!-- Nav Item - User Information -->
                        <li class="nav-item dropdown no-arrow">
                            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                                data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                <span class="mr-2 d-none d-lg-inline text-gray-600 small">Dr. Dosen Pengampuh, M.Kom</span>
                                <img class="img-profile rounded-circle" src="img/undraw_profile.svg">
                            </a>
                        </li>

                    </ul>

                </nav>
                <!-- End of Topbar -->

                <!-- Begin Page Content -->
                <div class="container-fluid">

                    <div class="d-sm-flex align-items-center justify-content-between mb-4">
                        <h1 class="h3 mb-0 text-gray-800" id="formTitle" data-new="Tambah Prodi Baru" data-edit="Edit Program Studi">Tambah Prodi Baru</h1>
                        <a href="prodi.html" class="d-none d-sm-inline-block btn btn-sm btn-secondary shadow-sm">
                            <i class="fas fa-arrow-left fa-sm text-white-50"></i> Kembali ke Daftar Prodi</a>
                    </div>

                    <div class="row">
                        <div class="col-xl-7 col-lg-9">
                            <div class="card shadow mb-4">
                                <div class="card-header py-3">
                                    <h6 class="m-0 font-weight-bold text-primary">Tambah Prodi</h6>
                                </div>
                                <div class="card-body">
<form id="formProdi" autocomplete="off">
                        <input type="hidden" id="prodiId">
                        <div class="form-group">
                            <label for="prodiKode" class="font-weight-bold">Kode Prodi</label>
                            <input type="text" class="form-control" id="prodiKode" placeholder="Contoh: PR005" maxlength="10" required>
                        </div>
                        <div class="form-group">
                            <label for="prodiNama" class="font-weight-bold">Nama Program Studi</label>
                            <input type="text" class="form-control" id="prodiNama" placeholder="Contoh: Teknik Informatika" required>
                        </div>
                        <div class="form-group">
                            <label for="prodiJenjang" class="font-weight-bold">Jenjang Studi</label>
                            <select class="form-control" id="prodiJenjang" required>
                                <option value="D3">D3 - Diploma Tiga</option>
                                <option value="D4">D4 - Sarjana Terapan</option>
                                <option value="S1" selected>S1 - Sarjana</option>
                                <option value="S2">S2 - Magister</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="prodiKaprodi" class="font-weight-bold">Ketua Program Studi (Kaprodi)</label>
                            <input type="text" class="form-control" id="prodiKaprodi" placeholder="Nama lengkap beserta gelar" required>
                        </div>
                        <div class="form-group mb-0">
                            <label for="prodiAkreditasi" class="font-weight-bold">Akreditasi</label>
                            <select class="form-control" id="prodiAkreditasi" required>
                                <option value="Unggul">Unggul</option>
                                <option value="Baik Sekali">Baik Sekali</option>
                                <option value="Baik">Baik</option>
                                <option value="A">A</option>
                                <option value="B">B</option>
                            </select>
                        </div>
                    </form>
                                </div>
                                <div class="card-footer text-right bg-white">
                                    <a class="btn btn-secondary" href="prodi.html">Batal</a>
                                    <button class="btn btn-primary" type="submit" form="formProdi">Simpan Data</button>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

            </div>
